name = "cfmmReplicationPlank"
defaultTargets = ["cfmmReplicationPlank"]

# Pinned to v4.30.0 to match Philogy/LeanEVM (toolchain must agree).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

# Executable formal EVM model — scaffolding for later proofs about the
# on-chain Plank/Solidity implementation. NOTE: builds native artifacts
# (FFI .c sources for SHA-2 and Keccak; a Rust helper `tools/evmrs`), so
# the build host needs `cc` and `cargo`. `exp/eta.lean` does NOT import it,
# so the η-refutation can prove even if this dependency fails to build.
[[require]]
name = "evm"
git = "https://github.com/Philogy/LeanEVM.git"
rev = "ab5e33949f9053a494b05ab0143f9ca92567eb4a"

[[lean_lib]]
name = "cfmmReplicationPlank"
srcDir = "."
roots = ["exp.eta"]
