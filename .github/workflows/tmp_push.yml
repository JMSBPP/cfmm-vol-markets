name: tmp-push

on:
  push:

jobs:
  submodules:
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: submodules
        run: |
          git submodule sync --recursive
          git submodule update --init lib/plankified-univ3
          git submodule update --init --recursive lib/plank-monorepo

  toolchain:
    needs: submodules
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive lib/plank-monorepo
      - name: Plank toolchain
        run: make plank-toolchain
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! test -x "$HOME/.local/bin/just"; then
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

  plank:
    needs: toolchain
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: submodules
        run: |
          git submodule sync --recursive
          git submodule update --init lib/plankified-univ3
          git submodule update --init --recursive lib/plank-monorepo
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! test -x "$HOME/.local/bin/just"; then
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: plank
        run: just plank test/types/PairHarness.plk

  foundry:
    needs: plank
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: install foundry
        run: |
          set -euo pipefail
          . ./.github/foundry-version
          : "${FOUNDRY_VERSION:?}" "${FOUNDRY_COMMIT:?}" "${FOUNDRYUP_INSTALLER_COMMIT:?}"

          PINS="$HOME/.foundry-pins"
          export FOUNDRY_DIR="$PINS/$FOUNDRY_VERSION"
          mkdir -p "$FOUNDRY_DIR"

          if ! test -x "$FOUNDRY_DIR/bin/forge"; then
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/foundry-rs/foundryup/${FOUNDRYUP_INSTALLER_COMMIT}/foundryup-init.sh" \
              -o "$RUNNER_TEMP/foundryup-init.sh"
            set +e
            out="$(bash "$RUNNER_TEMP/foundryup-init.sh" 2>&1)"; rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ] && ! printf '%s' "$out" | grep -q 'could not detect shell'; then
              echo "::error::foundryup-init.sh failed (exit $rc)"; exit 1
            fi
            "$FOUNDRY_DIR/bin/foundryup" --install "${FOUNDRY_VERSION#v}"
            "$FOUNDRY_DIR/bin/forge" --version | grep -qF "$FOUNDRY_COMMIT" || {
              echo "::error::forge commit does not match pin"
              exit 1
            }
          fi
          echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"

      - name: forge version
        run: forge --version

  deps:
    needs: foundry
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Foundry on PATH
        run: |
          set -euo pipefail
          . ./.github/foundry-version
          echo "$HOME/.foundry-pins/$FOUNDRY_VERSION/bin" >> "$GITHUB_PATH"

      - name: Submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init lib/forge-std
          git submodule update --init lib/plank-foundry-deployer
          git submodule update --init lib/plankified-univ3
          git submodule update --init --recursive lib/plank-monorepo
          git submodule update --init lib/panoptic-v2-core
          git -C lib/panoptic-v2-core config submodule.lib/panoptic-helper.update none
          git submodule update --init --recursive lib/panoptic-v2-core/lib/v4-core

      - name: Restore npm cache
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: tmp-push-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: tmp-push-npm-

      - name: Restore cargo cache
        uses: actions/cache@v4
        id: cargo-cache
        with:
          path: lib/plank-monorepo/plankc/target
          key: tmp-push-cargo-${{ hashFiles('lib/plank-monorepo/plankc/Cargo.lock') }}
          restore-keys: tmp-push-cargo-

      - name: Plank toolchain
        run: make plank-toolchain

      - name: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Forge-installed libs
        run: |
          set -euo pipefail
          SOLMATE_COMMIT=4b47a19038b798b4a33d9749d25e570443520647
          V4_HOOKS_PUBLIC_COMMIT=ffd7f8a8d1f5df5deb6f41c8d2ba99d118244ed6
          V4_PERIPHERY_COMMIT=76c1891c481cebb4ff58f262473303f01a2d7393
          if ! test -f lib/solmate/src/test/utils/mocks/MockERC20.sol \
            || [ "$(git -C lib/solmate rev-parse HEAD 2>/dev/null || echo)" != "$SOLMATE_COMMIT" ]; then
            rm -rf lib/solmate
            forge install transmissions11/solmate@${SOLMATE_COMMIT} --no-git
          fi
          if ! test -f lib/v4-hooks-public/test/mocks/MockCounterHook.sol \
            || [ "$(git -C lib/v4-hooks-public rev-parse HEAD 2>/dev/null || echo)" != "$V4_HOOKS_PUBLIC_COMMIT" ]; then
            rm -rf lib/v4-hooks-public
            forge install Uniswap/v4-hooks-public@${V4_HOOKS_PUBLIC_COMMIT} --no-git
          fi
          if ! test -f lib/v4-periphery/src/base/ImmutableState.sol \
            || [ "$(git -C lib/v4-periphery rev-parse HEAD 2>/dev/null || echo)" != "$V4_PERIPHERY_COMMIT" ]; then
            rm -rf lib/v4-periphery
            forge install Uniswap/v4-periphery@${V4_PERIPHERY_COMMIT} --no-git
          fi

      - name: Upload dependency closure
        uses: actions/upload-artifact@v4
        with:
          name: dependency-closure
          path: |
            lib/
            node_modules/
          retention-days: 1

  pair-test:
    needs: deps
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download dependency closure
        uses: actions/download-artifact@v4
        with:
          name: dependency-closure

      - name: Foundry on PATH
        run: |
          set -euo pipefail
          . ./.github/foundry-version
          echo "$HOME/.foundry-pins/$FOUNDRY_VERSION/bin" >> "$GITHUB_PATH"

      - name: pair-test
        run: >
          forge test test/types/Pair.t.sol -vvvv --offline
          --remappings 'solmate/=lib/solmate/'

  registry-test:
    needs: deps
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download dependency closure
        uses: actions/download-artifact@v4
        with:
          name: dependency-closure

      - name: Foundry on PATH
        run: |
          set -euo pipefail
          . ./.github/foundry-version
          echo "$HOME/.foundry-pins/$FOUNDRY_VERSION/bin" >> "$GITHUB_PATH"

      - name: registry-import-compile
        run: >
          forge build --contracts test/types/protocol_integrations/Registry.t.sol
          --offline
