name: tmp-push

on:
  push:

jobs:
  submodules:
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: submodules
        run: |
          git submodule sync --recursive
          git submodule update --init lib/plankified-univ3
          git submodule update --init --recursive lib/plank-monorepo

  toolchain:
    needs: submodules
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive lib/plank-monorepo
      - name: Plank toolchain
        run: make plank-toolchain
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! test -x "$HOME/.local/bin/just"; then
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

  plank:
    needs: toolchain
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: submodules
        run: |
          git submodule sync --recursive
          git submodule update --init lib/plankified-univ3
          git submodule update --init --recursive lib/plank-monorepo
      - name: install just
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! test -x "$HOME/.local/bin/just"; then
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: plank
        run: just plank test/types/PairHarness.plk

  foundry:
    needs: plank
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: install foundry
        run: |
          set -euo pipefail
          . ./.github/foundry-version
          : "${FOUNDRY_VERSION:?}" "${FOUNDRY_COMMIT:?}" "${FOUNDRYUP_INSTALLER_COMMIT:?}"

          PINS="$HOME/.foundry-pins"
          export FOUNDRY_DIR="$PINS/$FOUNDRY_VERSION"
          mkdir -p "$FOUNDRY_DIR"

          if ! test -x "$FOUNDRY_DIR/bin/forge"; then
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/foundry-rs/foundryup/${FOUNDRYUP_INSTALLER_COMMIT}/foundryup-init.sh" \
              -o "$RUNNER_TEMP/foundryup-init.sh"
            set +e
            out="$(bash "$RUNNER_TEMP/foundryup-init.sh" 2>&1)"; rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ] && ! printf '%s' "$out" | grep -q 'could not detect shell'; then
              echo "::error::foundryup-init.sh failed (exit $rc)"; exit 1
            fi
            "$FOUNDRY_DIR/bin/foundryup" --install "${FOUNDRY_VERSION#v}"
            "$FOUNDRY_DIR/bin/forge" --version | grep -qF "$FOUNDRY_COMMIT" || {
              echo "::error::forge commit does not match pin"
              exit 1
            }
          fi
          echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"

      - name: forge version
        run: forge --version

  pair-test:
    needs: foundry
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: setup
        run: |
          set -euo pipefail
          . ./.github/foundry-version
          echo "$HOME/.foundry-pins/$FOUNDRY_VERSION/bin" >> "$GITHUB_PATH"
          git submodule sync --recursive
          git submodule update --init lib/forge-std
          git submodule update --init lib/plank-foundry-deployer
          git submodule update --init lib/plankified-univ3
          git submodule update --init --recursive lib/plank-monorepo
          make plank-toolchain
          # panoptic-v2-core@5555b32 -> v4-core@e50237c4 -> solmate@4b47a190 (MockERC20 only)
          SOLMATE_COMMIT=4b47a19038b798b4a33d9749d25e570443520647
          if ! test -f lib/solmate/src/test/utils/mocks/MockERC20.sol \
            || [ "$(git -C lib/solmate rev-parse HEAD 2>/dev/null || echo)" != "$SOLMATE_COMMIT" ]; then
            rm -rf lib/solmate
            forge install transmissions11/solmate@${SOLMATE_COMMIT} --no-commit
          fi

      - name: pair-test
        run: >
          forge test test/types/Pair.t.sol -vvvv --offline
          --remappings 'solmate/=lib/solmate/'
