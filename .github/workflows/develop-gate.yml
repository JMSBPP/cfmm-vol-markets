name: develop-gate
on:
  pull_request:
    branches: [develop]          # PR-only; merges go through PRs (no double-approval from a push trigger)
concurrency:
  group: develop-gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  approve:                       # the ONLY environment reference -> exactly one approval, BEFORE untrusted code runs
    runs-on: ubuntu-latest       # hosted: no toolchain, no untrusted code, frees the self-hosted executor
    environment: develop-gate
    timeout-minutes: 5
    steps:
      - run: echo "approved — heavy jobs may start"

  forge:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 25
    env:
      API_KEY: ${{ secrets.API_KEY }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      # forge auto-runs `git submodule update --init --recursive` (even with --offline) and HANGS on
      # panoptic-v2-core's self-recursive nesting. Strip the 3 NON-closure submodules from .gitmodules so the
      # auto-init only touches the safe closure (bunni-v2/forge-std/plank-foundry-deployer/plankified-univ3/v3-core).
      - run: |
          for s in panoptic-v2-core protocol plank-monorepo; do
            git config -f .gitmodules --remove-section "submodule.lib/$s" 2>/dev/null || true
          done
          git submodule update --init --recursive
      - run: forge test --via-ir --offline

  gams:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: make compile-gams

  plank:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: git submodule update --init lib/plankified-univ3
      - run: make compile-plank

  gamsdiff:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: cd tools/gamsdiff && uv sync --frozen && uv run pytest

  lean:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: |
          if [ ! -f lean/lakefile.toml ] && [ ! -f lean/lakefile.lean ]; then
            echo "::notice::no Lean project on develop yet (PR #2 pending) — lean gate passes (nothing to check)"; exit 0
          fi
          elan show >/dev/null 2>&1 || curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          out="$(cd lean && lake build 2>&1)"; echo "$out"
          # no-sorry guard via Lean's OWN compiler warning (comment/identifier-safe, unlike a source grep)
          echo "$out" | grep -qE "declaration uses '(sorry|admit)'" && { echo "::error::Lean proof uses sorry/admit"; exit 1; }
          echo "lean: lake build clean, no sorry/admit"

  gate:                          # the SOLE required check. Do NOT add `name:` (would change the context string)
    needs: [approve, forge, gams, plank, gamsdiff, lean]
    if: always()
    runs-on: ubuntu-latest       # hosted: only reads results, needs no toolchain
    timeout-minutes: 5
    steps:
      - run: |
          for x in '${{ needs.forge.result }}' '${{ needs.gams.result }}' '${{ needs.plank.result }}' '${{ needs.gamsdiff.result }}' '${{ needs.lean.result }}'; do
            case "$x" in success|skipped) ;; *) echo "::error::a gate job result was '$x'"; exit 1;; esac
          done
          echo "all gate jobs green"
