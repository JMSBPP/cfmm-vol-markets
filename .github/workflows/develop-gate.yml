name: develop-gate
on:
  pull_request:
    branches: [develop]          # PR-only; merges go through PRs (no double-approval from a push trigger)
concurrency:
  group: develop-gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  approve:                       # the ONLY environment reference -> exactly one approval, BEFORE untrusted code runs
    runs-on: ubuntu-latest       # hosted: no toolchain, no untrusted code, frees the self-hosted executor
    environment: develop-gate
    timeout-minutes: 5
    steps:
      - run: echo "approved — heavy jobs may start"

  forge:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 25
    env:
      API_KEY: ${{ secrets.API_KEY }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      # forge needs lib/panoptic-v2-core's nested v4-core + solady (remappings @uniswap/v4-core/ and
      # solady/ point into them). The ONLY pathological part is panoptic-helper (it contains
      # panoptic-v2-core -> infinite recursion). Init panoptic one level, block panoptic-helper, then
      # full recursive init; forge test --offline then finds everything present (no re-init hang).
      - run: |
          git submodule update --init lib/panoptic-v2-core
          git -C lib/panoptic-v2-core config submodule.lib/panoptic-helper.update none
          git submodule update --init --recursive
      # node_modules became a HARD forge dependency with the premium port (@cryptoalgebra
      # remappings in foundry.toml); package.json/package-lock.json are tracked for exactly
      # this closure (ffcc3b6 + the CI-reproducibility note). Without this step the compile
      # dies on missing @cryptoalgebra sources before any test runs.
      - run: npm ci --ignore-scripts
      # THE SKIP LEDGER (issue #16 owns burning it down; every entry is a PRE-EXISTING
      # known-broken family, excluded so the gate measures the maintained surface — the
      # same recorded-baseline discipline every local run uses):
      #   *PriceSetterHook*          tracked test fails compile (Deployers linearization)
      #   *VolRangeWidth* / *SpreadTickAssimetryHelper*   latent width-type fuzz bugs,
      #                              failure count is fuzz-SEED-dependent (2/3/6 measured)
      #   *PanopticVegaLens.t.sol*   drafted RED test; its harness is #10's L0 (not built)
      # (*VegaAccount* / *VegaIssuance* were on the ledger; un-broken by the
      #  VegaIssuanceLib sketch supersession in this PR — back on the surface.)
      # Seed pinned so the maintained surface is deterministic run-to-run.
      # VERIFIED LOCALLY against PR #15: 252 passed, 0 failed with exactly this command.
      - run: >
          forge test --via-ir --offline --fuzz-seed 4880
          --skip "*PriceSetterHook*" "*VolRangeWidth*" "*SpreadTickAssimetryHelper*"
          "*PanopticVegaLens.t.sol*"

  gams:
    # DISABLED (issue #16): stale monorepo copy, NOT runner rot — reproduced locally:
    # model/LiquidityKernel.gms `$include PricingKernel.gms` but the file moved to
    # model/pricing_geometry/ (GAMS-repo-split reorg; model/ is canonical in cfmm-gams).
    # 4 ok / 6 failed on rc=2 include errors. The CI workstream decides whether the
    # monorepo copy is re-pinned here or the job moves to cfmm-gams. Gate accepts 'skipped'.
    if: false
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: make compile-gams

  plank:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: git submodule update --init lib/plankified-univ3
      - run: make compile-plank

  gamsdiff:
    # DISABLED (issue #16): runner-env rot — GamsException on a doubled-suffix path
    # (model/PricingKernel.gms.gms) + rc=2; and model/ now lives canonically in the
    # cfmm-gams repo, so the CI workstream decides whether this job is fixed here or
    # moves there. The gate summary accepts 'skipped'.
    if: false
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: cd tools/gamsdiff && uv sync --frozen && uv run pytest

  lean:
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: |
          if [ ! -f lean/lakefile.toml ] && [ ! -f lean/lakefile.lean ]; then
            echo "::notice::no Lean project on develop yet (PR #2 pending) — lean gate passes (nothing to check)"; exit 0
          fi
          elan show >/dev/null 2>&1 || curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          # Lake's package clones + dep oleans persist OUTSIDE the git-clean-wiped workspace
          # (same class as ~/.elan and ~/.cache/mathlib). Reason this is load-bearing and not an
          # optimization: github git transfer measured ~33KB/s on this runner (2026-08-17), so the
          # ~1GB mathlib clone alone is ~8h — no timeout can cover a fresh clone. Lake re-validates
          # every package's checked-out rev against lake-manifest.json and re-fetches ONLY on
          # mismatch (self-healing but slow over this link; on a dependency bump, reseed
          # ~/.cache/lake-packages from a warm local tree instead of letting CI re-clone).
          # DELIBERATELY packages-only — the workspace build dir (lean/.lake/build) is NOT cached:
          # the sorry-guard below reads compiler warnings, which only fresh compiles emit, so our
          # own modules must always rebuild from source for the guard to stay sound.
          if [ -d "$HOME/.cache/lake-packages" ] && [ ! -d lean/.lake/packages ]; then
            mkdir -p lean/.lake && cp -a "$HOME/.cache/lake-packages" lean/.lake/packages
          fi
          out="$(cd lean && lake exe cache get >/dev/null 2>&1; lake build 2>&1)"; echo "$out"
          # no-sorry guard via Lean's OWN compiler warning (comment/identifier-safe, unlike a source grep)
          echo "$out" | grep -qE "declaration uses '(sorry|admit)'" && { echo "::error::Lean proof uses sorry/admit"; exit 1; }
          # cache-out, only when the manifest moved (one-time cost per dependency bump)
          SHA=$(sha256sum lean/lake-manifest.json | cut -d' ' -f1)
          if [ -d lean/.lake/packages ] && [ "$(cat "$HOME/.cache/lake-packages.manifest-sha" 2>/dev/null)" != "$SHA" ]; then
            rm -rf "$HOME/.cache/lake-packages"
            cp -a lean/.lake/packages "$HOME/.cache/lake-packages"
            echo "$SHA" > "$HOME/.cache/lake-packages.manifest-sha"
          fi
          echo "lean: lake build clean, no sorry/admit"

  haskell:
    # THE RIG IS PART OF THIS JOB. It is not optional and it is not decoration.
    #
    # This job was added chain-independent ("no anvil, no RPC, so no service is wired here").
    # That was false. 7 of the 85 checks hard-require offchain/rig/rig-manifest.json, which
    # .gitignore:58 excludes and which therefore does not exist in a checkout. MEASURED with the
    # manifest absent -- exactly the tree actions/checkout produces:
    #   FAIL sc3_load_succeeds              FAIL driv01_run_capture_is_present_and_fresh
    #   FAIL sc3_corrupted_manifest_fails   FAIL driv01_legacy_write_price_still_ran
    #   FAIL rpin05_capture_is_present_and_fresh   FAIL driv02_run_capture_orders_are_fresh
    #   FAIL driv01_cheat_swap_proof_is_present_and_fresh
    #   78/85 checks passed
    # `gate` below requires haskell in {success, skipped}, so the sole required check would have
    # gone red on EVERY run. It never actually executed once -- `gh pr checks 9` showed only
    # `approve pending` -- which is why nothing surfaced it.
    #
    # CONFIRMED absent rather than assumed: the runner's own workspace
    # (~/actions-runner-cfmm/_work/cfmm-replicationPlank/cfmm-replicationPlank) carries NO
    # out/, cache/, node_modules/, broadcast/, dist-newstyle/ and NO offchain/rig/rig-manifest.json
    # between runs. actions/checkout's default `clean: true` runs `git clean -ffdx`, and -x takes
    # ignored files with it. That single fact drives three decisions here: the manifest must be
    # produced in-job, npm ci must run every time, and forge recompiles from cold each time.
    #
    # So the job stands the rig up and becomes a real end-to-end gate. It runs on the SAME
    # self-hosted executor the forge and plank jobs use, because that executor -- and only that
    # executor -- has the toolchain the rig needs.
    needs: [approve]
    runs-on: [self-hosted, cfmm-build]
    # Was 45 for `cabal build` alone (123 Hackage deps; only the FIRST run on a cold ~/.cabal
    # store is slow -- the store lives outside the workspace, so `git clean -ffdx` does not
    # touch it). Raised for the work added below, all of which starts cold every run because
    # the workspace does not: npm ci, a full --via-ir forge compile, and six deploy scripts.
    # Reference point: the last GREEN develop-gate run (30752456447) finished the WHOLE
    # workflow, forge job included, in 6m45s.
    timeout-minutes: 60
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          # verify-import.sh runs `git diff <ref>` against the RECORDED ref in
          # offchain/rig/import-ref.txt (2039f27). A depth-1 checkout does not have that object
          # and git dies with `bad revision` (exit 128 -> the script's own SC-1 FAIL, so it fails
          # loudly rather than silently). Full history is what makes SC-1 actually run.
          #
          # CORRECTION to what this comment used to claim: it said 2039f27 is "NOT an ancestor of
          # the PR head". Since merge d7d1823 it IS one (`git merge-base --is-ancestor 2039f27
          # HEAD` exits 0). The RATIONALE rotted; the SETTING did not. fetch-depth: 0 is still
          # required, because depth-1 fetches no ancestors either -- being an ancestor and being
          # present in a shallow clone are different properties.
          fetch-depth: 0
      # ghcup lives in ~/.ghcup/bin, which a non-login `run:` shell does not pick up from
      # .bashrc. Put it on PATH, bootstrapping it if this executor has never built Haskell
      # (same shape as the lean job's elan bootstrap).
      - run: |
          if [ ! -x "$HOME/.ghcup/bin/ghcup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org \
              | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 \
                BOOTSTRAP_HASKELL_GHC_VERSION=9.10.3 \
                BOOTSTRAP_HASKELL_INSTALL_NO_STACK=1 \
                BOOTSTRAP_HASKELL_ADJUST_BASHRC=0 sh
          fi
          echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
      - run: |
          # 9.10.3 is not cosmetic: the .cabal pins base ^>=4.20.2.0, which no other GHC ships.
          [ "$(ghc --numeric-version 2>/dev/null)" = "9.10.3" ] || ghcup install ghc 9.10.3 --set
          command -v cabal >/dev/null || ghcup install cabal recommended --set
          ghc --version && cabal --version
          cabal update
      - run: |
          # `--enable-tests` is LOAD-BEARING. `cabal build -j all` on its own exits 0 without
          # ever compiling the test suite, so a suite that does not compile "passes". Measured
          # four times. Do not drop the flag.
          set -o pipefail
          cabal build --enable-tests -j all 2>&1 | tee "$RUNNER_TEMP/cabal-build.log"

          # -Wall is a project requirement -- enforce it instead of hoping. Scoped to
          # ^offchain/ so cabal's own `Warning:` lines and any dependency's output cannot
          # trip it; the trade-off is that a `<no location info>` warning slips through.
          #
          # THIS CHECK WAS VACUOUS, and it is the fifth instance of the class this PR is
          # chartered to close -- introduced by the commit that closed the other four. It was
          # a `grep -q` over a file whose EMPTINESS means pass. A `cabal build` that compiles
          # nothing emits no warnings, and the project's sole -Wall enforcement point then
          # certified clean having read nothing. MEASURED with the exact command above on a
          # warm tree:
          #     log bytes: 1365
          #     library modules compiled: 0     (zero '[N of M] Compiling' lines)
          #     offchain warning lines:   0
          #     -> old gate PASSES, having read nothing
          # It could not fire vacuously in CI only because actions/checkout's `clean: true`
          # runs `git clean -ffdx` and takes dist-newstyle with it -- safety living in another
          # system's DEFAULT rather than in the check. The obvious next optimisation under the
          # 60-minute budget is caching dist-newstyle, which silently converts this gate into a
          # no-op. offchain/test/Main.hs:782-793 diagnoses this exact shape and answers it with
          # a positive control AND a file-count floor. Same two answers here.
          #
          # ONE pattern, used by the control and by the check, so the control cannot pass while
          # the check greps for something else.
          WARN_RE='^offchain/[^ ]*:[0-9]+:[0-9]+: warning:'

          # (1) POSITIVE CONTROL. Absence may not read as success until the pattern has been
          # SHOWN matching. A throwaway module under offchain/ is compiled with -Wall by the
          # same GHC that just built the project, and the same $WARN_RE must match its real
          # output. This is what notices if GHC's diagnostic format changes, if -Wall stops
          # being passed, or if paths stop being repo-relative -- every one of which would
          # otherwise present as a permanently clean gate. `-fno-code` means no linking and no
          # dependencies; -outputdir keeps every artifact out of the work tree, and the source
          # is removed before the result is examined so no failure path can leak it.
          probe=offchain/WallGateProbe.hs
          printf 'module WallGateProbe where\nwallGateProbe = ()\n' > "$probe"
          probe_out=$(ghc -Wall -fno-code -v0 -outputdir "$RUNNER_TEMP/wall-probe" "$probe" 2>&1 || true)
          rm -f "$probe"
          if ! printf '%s\n' "$probe_out" | grep -qE "$WARN_RE"; then
            echo "::error::-Wall gate POSITIVE CONTROL failed: the pattern matched nothing in a"
            echo "::error::deliberately warning-producing compile, so a clean result below would"
            echo "::error::be evidence of nothing. GHC's diagnostic format or -Wall changed."
            printf '%s\n' "$probe_out"
            exit 1
          fi

          # (2) FLOOR on modules actually compiled. Derived from the tree, never a literal: a
          # pinned number would fail on every legitimate module addition and be raised
          # reflexively, which is how a pin becomes a rubber stamp. The three directories are
          # the .cabal's own hs-source-dirs (offchain/rig/gen-peer-bytes.hs is a standalone
          # script in none of them and is correctly not counted). MEASURED: a cold build
          # compiles 28 modules -- 24 library + 2 exe + 1 exe + 1 test -- against 28 .hs files.
          # A .hs file that sits in a source dir but is in no component is never compiled and
          # so is never -Wall-checked; that shows up here as a shortfall, which is the right
          # answer rather than a false alarm.
          compiled=$(grep -cE '^\[ *[0-9]+ of [0-9]+\] Compiling' "$RUNNER_TEMP/cabal-build.log" || true)
          expected=$(find offchain/lib offchain/app offchain/test -name '*.hs' | wc -l)
          if [ "$compiled" -lt "$expected" ]; then
            echo "::error::the -Wall gate read a build that compiled $compiled modules, but"
            echo "::error::offchain/{lib,app,test} hold $expected .hs files. A gate that reads a"
            echo "::error::build which compiled nothing certifies -Wall clean having read nothing."
            echo "::error::Causes, in order of likelihood: dist-newstyle was cached or otherwise"
            echo "::error::survived checkout (this gate requires a COLD build -- drop the cache or"
            echo "::error::add a 'cabal clean'); or a .hs file under a hs-source-dir is listed in no"
            echo "::error::component in the .cabal and is therefore never compiled or checked."
            exit 1
          fi
          echo "-Wall gate armed: pattern proven against a real GHC warning; $compiled modules compiled (>= $expected)"

          # (3) only now is an empty result meaningful.
          if grep -qE "$WARN_RE" "$RUNNER_TEMP/cabal-build.log"; then
            echo "::error::GHC emitted warnings under offchain/ (-Wall must be clean)"
            grep -nE "$WARN_RE" "$RUNNER_TEMP/cabal-build.log"
            exit 1
          fi
      # --- everything below exists to make `cabal test` meaningful ---------------------------
      #
      # The build above needs no chain. The SUITE does. Ordering is deliberate: the Haskell build
      # is the thing this PR is about, so it fails first and cheapest, before a minute of npm and
      # a full via-ir compile.

      # Same three lines as the forge job, for the same reason: forge needs
      # lib/panoptic-v2-core's nested v4-core + solady (remappings @uniswap/v4-core/ and solady/
      # point into them), and the ONLY pathological part is panoptic-helper (it contains
      # panoptic-v2-core -> infinite recursion). Init panoptic one level, block panoptic-helper,
      # then full recursive init.
      #
      # The RECURSIVE init is load-bearing HERE in a way it is not in the forge job. The deploy
      # scripts reach `plank build` over FFI at SCRIPT RUN TIME (Makefile:292-294:
      # deployPlank -> plankDeployFFI -> plankBuildFFI), and PlankDeployBase.s.sol:24-25 hands it
      # --dep v3=lib/plankified-univ3/plank/lib and --dep std=lib/plank-monorepo/std/. Both are
      # submodules (.gitmodules). `--init --recursive` covers them; the plank job's narrower
      # `--init lib/plankified-univ3` would not.
      - run: |
          git submodule update --init lib/panoptic-v2-core
          git -C lib/panoptic-v2-core config submodule.lib/panoptic-helper.update none
          git submodule update --init --recursive
      # node_modules is a HARD forge dependency: foundry.toml:6 lists it in `libs` and
      # foundry.toml:40-45 remap @cryptoalgebra/* into it. Without this the six deploy scripts
      # die on missing @cryptoalgebra sources before anvil is ever useful. The forge job does the
      # same; here it cannot be skipped either, because `git clean -ffdx` deleted node_modules.
      - run: npm ci --ignore-scripts

      # --- port 8545, and who owns it ---------------------------------------------------------
      #
      # deploy-rig.sh:27 hardcodes RPC_PORT=8545 and :26 the foundry alias `local`, which
      # foundry.toml:59 pins to http://127.0.0.1:8545. Neither is parameterised and neither file
      # is this workflow's to change, so 8545 is a FIXED, SHARED resource. Two questions follow.
      #
      # (1) Can two develop-gate runs collide on it? No, as configured. `gh api
      #     repos/:owner/:repo/actions/runners` returns exactly ONE runner carrying the
      #     `cfmm-build` label (cfmm-build-1, online), and a runner executes one job at a time.
      #     Concurrent PRs therefore QUEUE on the executor; their haskell jobs cannot overlap.
      #     The workflow-level `concurrency` group above is keyed on github.ref and does NOT
      #     provide this -- it only collapses repeat pushes to the same branch. A job-level
      #     concurrency group was considered and REJECTED: GitHub keeps at most one PENDING job
      #     per group and cancels any earlier pending one, so with three open PRs it would
      #     manufacture a `cancelled` result -> a red gate for no engineering reason, while
      #     adding no protection the single executor does not already give. If a second
      #     cfmm-build runner is ever registered, THIS ASSUMPTION DIES and the port must be
      #     parameterised before that happens.
      #
      # (2) Can it collide with a human? YES, and this workflow cannot prevent it. The runner is
      #     a systemd service running as the same user on the same host as the developer
      #     worktrees (User=jmsbpp, ~/actions-runner-cfmm), and deploy-rig.sh:162 kills the
      #     listener on 8545 unconditionally before starting its own. A gate run WILL tear down a
      #     locally-standing rig. The step below cannot stop that -- it RECORDS it, so the log
      #     says whose chain was displaced instead of leaving a developer guessing. It warns and
      #     does not fail: making the sole required check red because someone happened to be
      #     running anvil would be a worse failure mode than the displacement it reports.
      #     The durable fix is an RPC_PORT knob in deploy-rig.sh + a matching foundry alias;
      #     both files belong to other tracks.
      - run: |
          pids=""
          if command -v lsof >/dev/null 2>&1; then
            pids=$(lsof -ti tcp:8545 2>/dev/null || true)
          elif command -v fuser >/dev/null 2>&1; then
            pids=$(fuser 8545/tcp 2>/dev/null || true)
          fi
          if [ -n "$pids" ]; then
            echo "::warning::port 8545 was already in use before this job started; deploy-rig.sh will kill it"
            for p in $pids; do
              echo "  pid $p  cmd=$(tr '\0' ' ' < "/proc/$p/cmdline" 2>/dev/null || echo '?')  cwd=$(readlink "/proc/$p/cwd" 2>/dev/null || echo '?')"
            done
          else
            echo "port 8545 is free"
          fi

      # --- stand the rig up -------------------------------------------------------------------
      #
      # deploy-rig.sh owns anvil (fresh chain, --timestamp 1700000000), runs six forge scripts
      # and writes offchain/rig/rig-manifest.json. Its own preflight (deploy-rig.sh:81-116)
      # requires anvil, forge, cast, jq and one of lsof/fuser. All resolve on this executor in a
      # NON-LOGIN run shell -- verified in the runner's ~/actions-runner-cfmm/.path, which
      # carries /home/jmsbpp/.foundry/bin (anvil, forge, cast), /home/jmsbpp/.plank/bin (plank,
      # needed by the FFI above) and /usr/bin (jq, fuser). That is why ghcup needs the
      # $GITHUB_PATH step above and foundry/plank do not: only ghcup is missing from .path.
      #
      # The marker is written BEFORE the script, not after: from this line onward this job may
      # have taken ownership of 8545, and the cleanup step must know that even if the script
      # dies on its first command. $RUNNER_TEMP is per-job, so it cannot leak into another job.
      #
      # WHAT A FAILURE HALFWAY LOOKS LIKE: deploy-rig.sh is `set -euo pipefail` with an EXIT trap
      # (:178) that kills its own anvil on any nonzero exit, and it deletes stale broadcast/
      # records up front (:192) so a later step can never read a previous run's address. So a
      # half-run leaves no manifest and no chain, this step goes red, and cabal test never runs
      # against a partial rig. The trap does NOT fire if the job is cancelled out from under it --
      # that case is what the unconditional cleanup step at the bottom is for.
      #
      # --- THE HOST-WIDE RIG LOCK, and why these steps are now one step ----------------------
      #
      # The preflight above RECORDS the collision it cannot prevent. This serialises against
      # it, for the one class of victim that can cooperate.
      #
      # An RPC_PORT knob was considered and REFUSED, correctly: 8545 is hardcoded at ten sites,
      # and parameterising deploy-rig.sh ALONE would leave `--rpc-url "$RPC_ALIAS"` resolving
      # through foundry.toml:59 back to 8545 -- so CI would deploy INTO a developer's chain and
      # write a manifest describing it. Strictly worse than displacing them. An flock touches
      # none of those ten sites.
      #
      # THE LOCK MUST SPAN THE RIG'S WHOLE LIFETIME, not just the deploy. CI's anvil holds 8545
      # from deploy until teardown, and deploy-rig.sh kills the 8545 listener unconditionally at
      # both ends. A lock released after the deploy step would let a developer start a rig that
      # this job's teardown then kills -- the same defect, moved. A `run:` block is one process
      # and `exec 9>` closes when it exits, so the lock's lifetime is exactly this step's: hence
      # deploy + verify + test are ONE step, with the teardown on an EXIT trap INSIDE the lock.
      # ::group:: keeps the log readable. verify-import.sh is deliberately left OUTSIDE -- it is
      # a git/sha check that never touches the chain, and holding the lock through it would
      # extend the exclusion window for nothing.
      #
      # HONEST LIMIT, and it is the whole shape of this fix: flock is ADVISORY. It excludes only
      # processes that also take it. A developer who runs deploy-rig.sh directly is unaffected
      # and will still displace this job, exactly as today. What it buys is that cooperation is
      # now POSSIBLE and is one command:
      #     flock ~/.cfmm-rig-8545.lock bash offchain/rig/deploy-rig.sh
      # This is not a claim that the collision is closed. It is the subset that is safe to do
      # from this file alone.
      #
      # $HOME, not /tmp: the runner is a systemd service (User=jmsbpp, verified) and a unit with
      # PrivateTmp=yes gets a /tmp namespace of its own, which would silently give CI and the
      # developer two different "shared" lockfiles that never exclude each other. $HOME is
      # /home/jmsbpp for both, verified on this host.
      #
      # Failing on timeout is deliberate. The lock is opt-in, so it can only be held by someone
      # who took it knowingly; waiting 30 minutes and then refusing to run is honest, and it is
      # better than destroying the rig of the one developer who cooperated.
      - run: |
          # `9>>` and NOT `9>`: the plain form opens with O_TRUNC and would wipe the current
          # holder's identity line before we have even tried to take the lock, so the diagnostic
          # below could never print anything. Measured -- "Holder:" came back empty against a
          # holder that had definitely written its record.
          exec 9>>"$HOME/.cfmm-rig-8545.lock"
          if ! flock -w 1800 9; then
            echo "::error::could not take $HOME/.cfmm-rig-8545.lock within 30 minutes."
            echo "::error::Another process holds the rig lock; refusing to displace it. Holder:"
            cat "$HOME/.cfmm-rig-8545.lock" 2>/dev/null || true
            exit 1
          fi
          echo "develop-gate haskell job, run ${GITHUB_RUN_ID:-?}, pid $$" > "$HOME/.cfmm-rig-8545.lock"

          # From here on this job owns 8545. The marker and the trap are set BEFORE the deploy,
          # so a failure in its first command still tears down and still tells the always() step
          # below that an anvil may exist. --stop is idempotent and non-failing by design.
          : > "$RUNNER_TEMP/rig-owned-8545"
          trap 'bash offchain/rig/deploy-rig.sh --stop || true' EXIT

          echo "::group::deploy-rig.sh"
          bash offchain/rig/deploy-rig.sh
          echo "::endgroup::"

          # SC-2, and it is not redundant with the deploy. deploy-rig.sh proves the scripts RAN;
          # verify-rig.sh proves the result is LIVE -- nonzero bytecode at every one of the nine
          # manifest addresses, orderCount() decoding, and RealizedVolatilityMod actually seeded.
          # It reads every probe target out of the manifest, so it also confirms the manifest
          # describes the chain that is up, which is exactly what the 7 checks below assume.
          echo "::group::verify-rig.sh"
          bash offchain/rig/verify-rig.sh
          echo "::endgroup::"

          # NOW the suite means something. The 7 checks in it assert the COMMITTED capture
          # artifacts (batch-return-capture.json, driver-run-capture.json, cheat-swap-proof.json)
          # still describe the deployment that is up: chainId, generatedFrom, VolOrderManagerMod,
          # PoolManager, DynamicFeeHook, tickSpacing. deploy-rig.sh is deterministic (fixed
          # mnemonic, fixed genesis, fresh chain), so the CREATE addresses reproduce -- but
          # DynamicFeeHook is CREATE2 and therefore BYTECODE-dependent. A PR that changes the
          # hook's Solidity moves that address and reddens driv01 until the captures are re-taken.
          # That is the intended discipline, and each check's own error message names the command;
          # it is not a CI defect.
          # (The driver itself -- `cabal run cfmm-replicationPlank-rpc-api` -- is deliberately NOT
          #  run here: it REWRITES the tracked capture it is being checked against, which would
          #  convert a staleness failure into a silent pass.)
          echo "::group::cabal test"
          cabal test
          echo "::endgroup::"
      # SC-1: the 37 imported source-of-truth paths are content-identical to the recorded ref
      # AND sha256-match IMPORT-PIN.md. Unrun, "verbatim import" is a claim, not a check.
      - run: bash offchain/rig/verify-import.sh
      # Unconditional teardown. Without it a failed job leaves anvil holding 8545 on an executor
      # that PERSISTS between jobs -- unlike a hosted runner, nothing here is thrown away at the
      # end of a run, so the leak would outlive the workflow and the next deploy would inherit it.
      # Guarded on the marker rather than on `always()` alone: if the job died in cabal build,
      # this job never started an anvil, and a bare --stop would then kill a DEVELOPER's rig on
      # the shared host for a failure that had nothing to do with the chain.
      - if: always()
        run: |
          if [ -e "$RUNNER_TEMP/rig-owned-8545" ]; then
            bash offchain/rig/deploy-rig.sh --stop
          else
            echo "this job never reached the deploy step; leaving port 8545 alone"
          fi

  gate:                          # the SOLE required check. Do NOT add `name:` (would change the context string)
    needs: [approve, forge, gams, plank, gamsdiff, lean, haskell]
    if: always()
    runs-on: ubuntu-latest       # hosted: only reads results, needs no toolchain
    timeout-minutes: 5
    steps:
      - run: |
          # `approve` is checked SEPARATELY and may not be 'skipped'. It was in `needs` but not in
          # the loop below, and because this job is `if: always()` while the loop accepts
          # 'skipped', a REJECTED environment review produced: approve=failure -> every heavy job
          # 'skipped' (they all need approve) -> six accepted results -> "all gate jobs green",
          # exit 0, with zero tests having run. The sole required check reported success for a run
          # that executed nothing. Inherited from develop, which carries the identical loop.
          #
          # 'success' is the only acceptable value: approve carries no `if:`, so on a PR it always
          # runs, and it has no `needs` that could skip it. That also makes this the COMPLETE fix
          # -- the only other way a job below reaches 'skipped' is its own `if:` (deliberate, see
          # gams/gamsdiff), because approve is the single dependency every one of them declares.
          case '${{ needs.approve.result }}' in
            success) ;;
            *) echo "::error::approve was '${{ needs.approve.result }}' -- the environment review did not pass, so every gate job was skipped and NOTHING ran"; exit 1;;
          esac
          # 'skipped' stays acceptable here on purpose: gams and gamsdiff are `if: false` (issue #16).
          for x in '${{ needs.forge.result }}' '${{ needs.gams.result }}' '${{ needs.plank.result }}' '${{ needs.gamsdiff.result }}' '${{ needs.lean.result }}' '${{ needs.haskell.result }}'; do
            case "$x" in success|skipped) ;; *) echo "::error::a gate job result was '$x'"; exit 1;; esac
          done
          echo "all gate jobs green"
