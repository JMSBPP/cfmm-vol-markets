# Domain catalog for `just spec-compile` / push-build.
# SPEC_DOMAIN (env or Actions vars.SPEC_DOMAIN) selects a key under [domains.*];
# if unset, `default` is used. Unknown domain → fail closed.

default = "StrikeMultiplier"

[domains.StrikeMultiplier]
path = ".spec/StrikeMultiplier.spec"
compile = ".spec/StrikeMultiplier.spec/compile.toml"
