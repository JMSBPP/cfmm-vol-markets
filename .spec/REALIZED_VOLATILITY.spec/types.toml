# REALIZED_VOLATILITY type catalog (idris-tdd kinds).

[SigmaF]
module = "SigmaF"
kind = "generic"
file = "types/SigmaF/SigmaF.md"
carriers = ["Ray"]
operations = ["intro", "intro_from_u256"]
laws = [
  "SigmaF(N); only N=Ray this slice",
  "intro :: Ray → SigmaF(Ray); carrier { r: Ray }",
  "intro_from_u256 = intro ∘ Ray.intro",
  "Eff = []",
  "no token_amount (owned by TokenAmountStock)",
]
refined = false
notes = "Type #151: phantom N; Ray only. Product moved to TokenAmountNetFlowStochasticBase. CEV block notation."

[TokenAmountNetFlowStochasticBase]
module = "TokenAmountNetFlowStochasticBase"
kind = "dependent"
file = "types/TokenAmountNetFlowStochasticBase/TokenAmountNetFlowStochasticBase.md"
carriers = ["SigmaF(N)", "DeltaW(dt)", "TokenAmountStock(T)"]
operations = ["intro_base", "stock", "magnitude", "direction"]
laws = [
  "C = SigmaF(N) only; N=Ray only this slice",
  "Weiner(dt) ≡ DeltaW(dt)",
  "intro_base packs (σ, ΔW)",
  "stock(b) = (σ · ΔW) / unit(N); unit(Ray)=rayVal(rayMulId())",
  "TokenAmountStock = signed u256; magnitude/direction in define",
  "checked mul/div → revert; Eff = []",
]
refined = false
notes = "Type #151. stock/magnitude/direction filled for CI bridge; TokenFlow #152 still owns full refine. holes cleared for stock path."

[TokenFlow]
module = "TokenFlow"
kind = "dependent"
file = "types/TokenFlow/TokenFlow.md"
carriers = ["TokenAmount", "Dir", "token", "from", "to"]
operations = ["intro"]
laws = [
  "intro(σ_F, ΔW(dt), token, from, to) = ((σ_F · |ΔW|)/RAY, sign(ΔW)) at those addrs",
  "dt is the DeltaW index (TimeSpacing)",
  "Eff = [ERC20View=balanceOf, Xfer=transferFrom]",
]
refined = true
notes = "Command T; run reads addresses off T"

[IO]
module = "IO"
kind = "generic"
file = "types/IO/IO.md"
carriers = ["T", "Outcome"]
operations = ["io", "run"]
laws = [
  "io only wraps",
  "run(io(T)) reads token/from/to on T",
  "run(io(amt,+)) = Xfer(from,to,amt)",
  "run(io(amt,-)) = Xfer(to,from,amt)",
  "Outcome wraps Option(u256): Some = success, None = revert",
]
refined = true
notes = "Outcome is a wrapper of std::option::Option(u256)"

[TokenHistory]
module = "TokenHistory"
kind = "indexed"
file = "types/TokenHistory/TokenHistory.md"
carriers = ["Step", "TokenHistory(dt,K)", "Slice(memory)"]
operations = ["intro_from", "intro", "intro_k", "intro_len", "step_k"]
laws = [
  "TokenHistory(dt,0) = ε",
  "TokenHistory(dt,S k) = Step(dt) × TokenHistory(dt,k)",
  "nest K ∈ ℕ includes ε; intro_from(0)=ε, intro_from(S k)=step(off) ∷ intro_from(k)",
  "intro writes the nest into Slice(memory, TokenHistory(dt,K), 1)",
  "intro_k: Some iff 0 < K < n(dt); buffer is Slice of Step",
  "intro_len = K iff 0 < K < n(dt), else 0",
  "step_k: Some(step_at(j)) iff 0 < K < n(dt) and j < K",
  "ABI intro returns intro_len; cells via step_k(j)",
  "t_j = t_init + j·dt̄",
  "i_j = lastIndex(dt, t_init, t_j)",
  "ΔW_j = shock(dt, j)",
  "ΔQ_M,j = σ_F · ΔW_j",
  "Eff = [WeinerView=staticcall shock]",
]
refined = true
notes = "Slice is allocation only. Fuzz: 1 ≤ K < n(dt)=43200 via step_k."

[TokenHistoryFlow]
module = "TokenHistoryFlow"
kind = "indexed"
file = "types/TokenHistoryFlow/TokenHistoryFlow.md"
carriers = ["TokenHistory(dt,K)", "TokenFlow", "token", "from", "to"]
operations = ["io_hist", "run_hist", "run_step_k", "run_k"]
laws = [
  "run_k: while j<K run_step_k; None if K=0 or K≥n",
  "run_step_k: step_k then run_io(token_flow); None if prefix invalid or j≥K",
  "+ΔW: Xfer(from,to,amt); −ΔW: Xfer(to,from,amt)",
  "amt = (σ_F · |ΔW_j|)/RAY",
  "first Outcome.None stops the while",
  "Eff = [WeinerView=shock, Xfer=transferFrom]",
]
refined = true
notes = "run_hist is K=2 nest unroll, not a public law. Fuzz: run_k K∈[1,128]."

[CEVLocalTickVolatility]
module = "CEVLocalTickVolatility"
kind = "dependent"
file = "types/CEVLocalTickVolatility/CEVLocalTickVolatility.md"
carriers = ["Tick", "u88_tick2", "SigmaF", "LiquidityChunk", "ObsStep(dt)"]
operations = ["intro", "try_intro", "intro_len", "step_k"]
laws = [
  "L_{1/2} = LiquidityChunk.liquidity : u128",
  "√p_j = ObsStep(dt).sqrt_p : Q64_96; tick_j = ObsStep(dt).tick",
  "ratio = floor(mulDiv(σ_F.raw,Q96,√p_j) / L_{1/2} / LN_10001)",
  "σ = ratio² ∈ u88 tick²; tick = observed tick_j",
  "intro(σ_F, LiquidityChunk, ObsStep(dt)) → {tick, σ} or revert",
  "try_intro → Option; None on L=0 / √p=0 / σ∉u88 (law-B map for #140; same arithmetic)",
  "revert ZeroLiquidity if LiquidityChunk.liquidity=0",
  "revert ZeroSqrtPrice if ObsStep.sqrt_p=0",
  "revert SigmaOverflowU88 if σ ∉ u88",
  "CEVHistory(dt,0)=ε; CEVHistory(dt,S k)=cell × CEVHistory(dt,k)",
  "intro_len = K iff 0 < K < n(dt), else 0",
  "step_k: Some(intro(σ_F, shared chunk, obs_j)) iff 0 < K < n(dt) and j < K",
  "Eff = [StateView, LiquidityChunkMinter], discharged before pure intro/step_k",
]
refined = true
notes = "Refined by #135: typed LiquidityChunk + ObsStep inputs, observed tick authority, u88 storage, overflow-safe factorization. Effectful ordering is #136."

[LiquidityChunk]
module = "LiquidityChunk"
kind = "dependent"
file = "types/LiquidityChunk/LiquidityChunk.md"
carriers = ["LiquidityTick", "LiquidityChunk", "TickSpacing", "u128"]
operations = ["liquidity_tick", "intro", "pack_panoptic", "unpack_panoptic"]
laws = [
  "LiquidityTick = Σ s:TickSpacing. signed-int24 exactly aligned to s",
  "LiquidityChunk = Σ s:TickSpacing. {tickLower: LiquidityTick(s), tickUpper: LiquidityTick(s), liquidity: u128}",
  "tickLower < tickUpper",
  "liquidity > 0",
  "packPanoptic = lower:24 | upper:24 | zero:80 | liquidity:128",
  "unpackPanoptic rejects nonzero reserved bits and every invalid constructor state",
]
refined = false
notes = "Define: intro, pack_panoptic, checked unpack_panoptic. Distinct from VegaTarget; #131 owns later refinement and mapping."

[LiquidityChunkMinter]
module = "LiquidityChunkMinter"
kind = "indexed"
file = "types/LiquidityChunkMinter/LiquidityChunkMinter.md"
carriers = ["LiquidityChunkMint(V)", "MintReceipt(V)", "Pool(V)", "IO(T)"]
operations = ["mint_v3", "mint_algebra", "mint_v4", "io_mint", "run_mint"]
laws = [
  "V ∈ {V3, Algebra, V4} is selected at comptime",
  "common command = adapter × Pool(V) × payer × beneficiary × LiquidityChunk",
  "Pool(V).tickSpacing = LiquidityChunk.tickSpacing",
  "Algebra context adds leftoversRecipient",
  "V4 context adds Pair × Registry(V4) × salt × hookData",
  "run_mint : IO(LiquidityChunkMint(V)) → Option(MintReceipt(V))",
  "MintReceipt(V3) = amount0 × amount1",
  "MintReceipt(Algebra) = amount0 × amount1 × liquidityActual",
  "MintReceipt(V4) = callerDelta × feesAccrued × positionKey",
  "mint is positive-only",
  "Eff = [VenueMintCall, ERC20TransferFrom, AuthenticatedCallbackContext, V4UnlockSettlement]",
]
refined = false
notes = "Define: Algebra command constructor. Execution remains a hole. Adapters own exact-pay callbacks/settlement; callback context is caller- and command-bound. PRD #130."

[StateView]
module = "StateView"
kind = "indexed"
file = "types/StateView/StateView.md"
carriers = ["ObsStep(dt)", "StateView(dt,K)", "StateViewAnchor", "RealizeCmd", "IO(RealizeCmd)"]
operations = ["intro_anchor", "intro_len", "step_k", "io_realize", "run_swap", "pool_tick_after", "encode_flow_to_swap"]
laws = [
  "StateView(dt,0)=ε; StateView(dt,S k)=ObsStep(dt)×StateView(dt,k)",
  "t_j=t_init+j·dt; i_j=lastIndex(dt,t_init,t_j)",
  "tick_j=i(t_j+) after run_swap(io(realize(flow_j,pool,j)))",
  "cell_j=(t_j,tick_j,sqrt_p_j); step_K=Some(cell_j) iff 0<K<n(dt) and j<K",
  "run_swap uses Swap only; Xfer⊂Swap; no run_io on realize path",
  "Eff slice: ERC20View, Xfer, Swap (TokenFlow extension); no oracle Eff yet",
]
refined = false
notes = "Define: intro_anchor, prefix intro_len/step_k, io_realize/run_swap (StateViewRunSwap.btt). pool_tick_after/encode refine remain. PRD #134."

[CEVStateRunner]
module = "CEVStateRunner"
kind = "indexed"
file = "types/CEVStateRunner/CEVStateRunner.md"
carriers = ["SigmaF", "LiquidityChunk", "StateViewAnchor", "WeinerCmd", "DeltaW(dt)"]
operations = ["io", "run_j"]
laws = [
  "CEVStateRunner(dt,K) <- SigmaF × LiquidityChunk × StateViewAnchor",
  "io wraps only; run_j = run_weiner → token_flow(to=pool) → run_swap → step_k → CEV.try_intro",
  "run_j(m, token, from, j) → Option(CEVLocalTickVolatility); law B; no TokenFlow/amount/dir ABI",
  "None if K=0 or K≥n(dt) or j≥K or Weiner/swap/obs/try_intro None",
  "Eff = [StateView, Timestamp]; WeinerView deferred; μ_F=0; chunk pre-validated",
  "Success leaf: admissible σ_F ∈ [1e-6, 1e-3]; fail leaf may use out-of-band σ_F",
]
refined = true
notes = "Refine #141 after #147/#140. Sibling TokenFlow Ray #151. Deferred: Weiner None inducible; distinct step_k None."

[Shock]
module = "Shock"
kind = "generic"
file = "types/Shock/Shock.md"
carriers = ["Shock(T)", "ShockCmd", "Pips"]
operations = ["io", "run_shock", "val"]
laws = [
  "Shock(T) <- { inner: T }; first T = Pips (cfmm_types)",
  "io wraps ShockCmd; run_shock reads Timestamp env + entropy → Option(Shock(T))",
  "Outcome law: Some = Shock(T), None = Timestamp/entropy failure",
  "val(Shock(T)) → T",
  "Eff = [Timestamp]",
]
refined = false
notes = "Type #149; define #150 run_shock success Shock(Pips) entropy B (PREVRANDAO‖timestamp‖j). Prereq of #143. Replaces legacy ShockPips carrier."

[WeinerGenerator]
module = "WeinerGenerator"
kind = "indexed"
file = "types/WeinerGenerator/WeinerGenerator.md"
carriers = ["DeltaW(dt)", "WeinerCmd", "Shock(Pips)"]
operations = ["io", "run_weiner", "val"]
laws = [
  "DeltaW(dt) <- { val: u256 } Ray-scale; dt in TimeSpacing",
  "io wraps WeinerCmd{j}; run_weiner reads Timestamp + Shock.run_shock → Option(DeltaW(dt))",
  "Outcome law: Some = DeltaW(dt), None = Shock/Timestamp/entropy failure",
  "val(DeltaW(dt)) → u256 (Ray carrier later)",
  "√dt = TimeSpacing.sqrt_dt(dt) → Ray (cfmm-types#26); product = rayVal(√)·mag/PIPS",
  "Eff = [Timestamp] (WeinerView); no local SQRT_DT_RAY table; no passed-eps deltaW",
]
refined = true
notes = "Refine #146: pin cfmm-types#26; drop host √ table; keep abs_signed for TokenFlow/SigmaF/TokenHistory."
