# Stackage snapshot pinned for reproducibility (Phase 9 Wave-0 build gate).
#
# lts-24.50 ships GHC 9.10.3 (matches the system GHC, so Stack reuses it with no
# extra GHC download) together with hmatrix-0.20.2, ad-4.5.6, statistics-0.16.5.0,
# cassava-0.5.4.1, aeson-2.2.5.0, req-3.13.4, http-conduit-2.3.9.1,
# optparse-applicative-0.18.1.0, vector-0.13.2.0, math-functions-0.3.4.4 and
# hspec-2.11.17 -- all the numeric/IO stack this phase needs.
resolver: lts-24.50

packages:
  - .

# hmatrix-gsl is NOT in lts-24.50, so it is pinned here as an extra-dep at its
# latest Hackage release. hmatrix-gsl-0.19.0.1 requires hmatrix>=0.18 (compatible
# with the snapshot's hmatrix-0.20.2) and links the system GSL:
#   gsl-config --version => 2.8 ; libs -L/usr/lib -lgsl -lgslcblas -lm ;
#   headers under /usr/include/gsl/.
# It exposes Numeric.GSL.Fitting (the Levenberg-Marquardt NLS optimizer that is
# the PRIMARY estimator for this phase).
extra-deps:
  - hmatrix-gsl-0.19.0.1
