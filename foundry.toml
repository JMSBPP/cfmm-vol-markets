[profile.default]
src = "src"
out = "out"
script = "foundry-scripts"
test = "test"
libs = ["lib", "node_modules"]
ffi = true
# This project ONLY compiles via the IR pipeline with the optimizer on: the reference
# contracts (VolatilityOracleStorage.layout(), the UniV3 oracle wrappers) hit "stack too deep"
# under legacy codegen or IR-without-optimizer. Every Makefile target already passes
# `--via-ir --optimize`; setting it here makes plain `forge test`/`forge build` -- and the CI
# gate's `forge test --via-ir --offline`, which does NOT pass --optimize -- consistent, instead
# of relying on every caller to remember the flags.
via_ir = true
optimizer = true

# The vendored SemiFungiblePositionManagerV4 does NOT compile under via-IR (Yul
# stack-too-deep in _createPositionInAMM; panoptic's own foundry.toml sets viaIR = false).
# It is therefore compiled in its own LEGACY-codegen unit: the E2E test deployCode()s the
# artifact instead of `new`-ing the source, so the via-IR requirement above (the vol
# reference contracts need it) and panoptic's legacy requirement never meet in one unit.
additional_compiler_profiles = [
    { name = "sfpm-legacy", via_ir = false },
]
compilation_restrictions = [
    { paths = "test/protocol_integrations/e2e_legacy/**", via_ir = false },
    { paths = "lib/panoptic-v2-core/contracts/SemiFungiblePositionManagerV4.sol", via_ir = false },
]
fs_permissions = [
    { access = "read", path = "./test/pos_spec/fixtures" },
    { access = "read", path = "./src/interfaces/pos_spec" },
    # The E2E deploys the legacy-compiled SFPM artifact by reading its JSON directly:
    # vm.getCode only consults the current run's artifact registry, which sparse test
    # compilation starves of the e2e_legacy anchor's outputs.
    { access = "read", path = "./out/SemiFungiblePositionManagerV4.sol" },
    # DeployAlgebraFactory.s.sol loads the Algebra factory/pool-deployer creation bytecode from
    # these files instead of embedding ~68KB of hex inline (which SIGSEGVs solc --via-ir).
    { access = "read", path = "./foundry-scripts/mev_tax_model_one/bytecode" },
    # The VolumePath test vm.exists/vm.readFile's its fixture here (dropped by the off-chain
    # rpc_api bridge, #25); until then the test self-skips.
    { access = "read", path = "./test/models/mev_tax_model_one/fixtures" },
    # The v4 VolumePath replay reads the same rig's identity files: loop-conformance.json (committed,
    # forkHeight + rig.poolId) and rig-manifest.json (gitignored, on-disk post-deploy-rig: the
    # PoolKey + contract addresses). Read-only — offchain writes remain the rpc_api workstream's.
    { access = "read", path = "./offchain/rig" },
]

remappings = [
	   "@cryptoalgebra/volatility-oracle-plugin/=node_modules/@cryptoalgebra/volatility-oracle-plugin/contracts",
	   "@cryptoalgebra/integral-core/=node_modules/@cryptoalgebra/integral-core/contracts",
	   # AdaptiveFee's differential oracle is vendored (test/premium/refs/AdaptiveFee.sol) because the
	   # published lib's unused integral-core contracts/-style import doesn't resolve in forge's
	   # node_modules compile context. This remap serves the self-contained config-type imports.
	   "@cryptoalgebra/dynamic-fee-plugin/=node_modules/@cryptoalgebra/dynamic-fee-plugin/contracts/",
	   "@solady/=lib/bunni-v2/lib/solady/src/"
]


[fuzz]
# 10 runs is not a test, it is a coin flip. The differential suite fuzzes over
# (init_timestamp x N_writes x tick x outlier x dt) -- a 5-dimensional space -- so a low run
# count is green by luck, not by coverage. Raised for the diff work.
runs = 256
# note: fail_on_revert is an [invariant] key, not a [fuzz] key -- it was inert here. Removed.

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY}"
local = "http://127.0.0.1:8545"
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
