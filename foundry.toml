[profile.default]
src = "src"
out = "out"
test = "test"
script = "foundry-scripts"
libs = ["lib", "node_modules"]
ffi = true
# This project ONLY compiles via the IR pipeline with the optimizer on: the reference
# contracts (VolatilityOracleStorage.layout(), the UniV3 oracle wrappers) hit "stack too deep"
# under legacy codegen or IR-without-optimizer. Every Makefile target already passes
# `--via-ir --optimize`; setting it here makes plain `forge test`/`forge build` -- and the CI
# gate's `forge test --via-ir --offline`, which does NOT pass --optimize -- consistent, instead
# of relying on every caller to remember the flags.
via_ir = true
optimizer = true
fs_permissions = [
    { access = "read", path = "./test/gamsDiff/fixtures" },
    { access = "read", path = "./test/pos_spec/fixtures" },
    { access = "read", path = "./src/interfaces/pos_spec" },
]

remappings = [
	   "@cryptoalgebra/volatility-oracle-plugin/=node_modules/@cryptoalgebra/volatility-oracle-plugin/contracts",
	   "@cryptoalgebra/integral-core/=node_modules/@cryptoalgebra/integral-core/contracts",
	   # AdaptiveFee.sol uses the contracts/-style import; longest-prefix beats the line above so it
	   # resolves to .../contracts/... (not a doubled .../contracts/contracts/...).
	   "@cryptoalgebra/integral-core/contracts/=node_modules/@cryptoalgebra/integral-core/contracts/",
	   "@cryptoalgebra/dynamic-fee-plugin/=node_modules/@cryptoalgebra/dynamic-fee-plugin/contracts/",
	   "@solady/=lib/bunni-v2/lib/solady/src/"
]


[fuzz]
# 10 runs is not a test, it is a coin flip. The differential suite fuzzes over
# (init_timestamp x N_writes x tick x outlier x dt) -- a 5-dimensional space -- so a low run
# count is green by luck, not by coverage. Raised for the diff work.
runs = 256
# note: fail_on_revert is an [invariant] key, not a [fuzz] key -- it was inert here. Removed.

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY}"
local = "http://127.0.0.1:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
