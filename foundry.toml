[profile.default]
src = "src"
out = "out"
script = "foundry-scripts"
test = "test"
libs = ["lib", "node_modules"]
ffi = true
via_ir = true
optimizer = true
# Protocol forks are links in .ref/protocol_references.ref, not compile deps.
# Solidity that used those remaps keeps the original source as comments
# (`// PROTOCOL REF:`) plus an empty stub so forge still compiles the file.
fs_permissions = [
    { access = "read", path = "./test/pos_spec/fixtures" },
    { access = "read", path = "./src/interfaces/pos_spec" },
    { access = "read", path = "./.bytecode/algebra" },
    { access = "read", path = "./offchain/rig" },
    { access = "read", path = "./.bytecode/uniswap-v4" },
    { access = "read", path = "./.bytecode/panoptic" }

]

remappings = [
	   "@solady/=lib/solady/src/",
	   "solady/=lib/solady/src/",
	   "@perfect-abstractions/compose/=node_modules/@perfect-abstractions/compose/",
	   "forge-std/=lib/forge-std/src/",
	   "@test/=test/",
	   "@helpers/=test/helpers/",
	   # lib/v4-core pinned to e50237c — nested IPoolManager.SwapParams (pre-PoolOperation).
	   # If a consumer needs the PoolOperation-era interface (bea7f6d), dual-mount it
	   # under a second remapping (e.g. v4-core-poolop/=lib/v4-core-bea7/src/) and
	   # import that alias only where required.
	   "v4-core/=lib/v4-core/src/",
	   "v4-periphery/=lib/v4-periphery/src/",
	   "v4-core-test/=lib/v4-core/test/",
	   # Prefer root pin over empty panoptic nested checkout
	   # (`@uniswap/=lib/panoptic-v2-core/lib/` auto-remap).
	   "@uniswap/v4-core/=lib/v4-core/",
	   "solmate/=lib/v4-core/lib/solmate/",
	   "panoptic-v2-core/=lib/panoptic-v2-core",
	   # TokenId.sol / PanopticMath (Instrument tests).
	   "@types/=lib/panoptic-v2-core/contracts/types/",
	   "@libraries/=lib/panoptic-v2-core/contracts/libraries/",
	   "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
	   "univ3-core/=lib/panoptic-v2-core/lib/v3-core/contracts/"
]


# Isolated compile for SigmaF / TokenFlow IO (#128). Backend is Anvil (just test-sigmaf).
[profile.sigmaf]
eth_rpc_url = "http://127.0.0.1:8545"
sparse_mode = true
skip = [
    "test/protocol_integrations/**",
    "test/types/protocol_integrations/**",
    "test/types/pos_spec/**",
    "test/lib/**",
    "test/premium/**",
    "test/tmp/**",
]

# Isolated compile for TimeIndex ↔ oracle init/write (avoids the rest of test/).
[profile.rv-init]
sparse_mode = true
skip = [
    "test/protocol_integrations/**",
    "test/types/protocol_integrations/**",
    "test/types/pos_spec/**",
    "test/lib/**",
    "test/premium/**",
    "test/tmp/**",
]

[fuzz]
# 10 runs is not a test, it is a coin flip. The differential suite fuzzes over
# (init_timestamp x N_writes x tick x outlier x dt) -- a 5-dimensional space -- so a low run
# count is green by luck, not by coverage. Raised for the diff work.
runs = 1000

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY}"
local = "http://127.0.0.1:8545"

# Isolated compile for WeinerGenerator box (avoids full monorepo node_modules).
[profile.weiner]
src = "src"
test = "test/weiner_gen"
out = "out-weiner"
libs = ["lib"]
ffi = false
via_ir = true
optimizer = true

[profile.draft]
src = "src"
test = "test/Draft.t.sol"
solc_version= "0.8.26"