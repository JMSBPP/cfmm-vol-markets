[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
ffi = true
fs_permissions = [{ access = "read", path = "./test/gamsDiff/fixtures" }]


[fuzz]
runs = 10
fail_on_revert = false

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY}"

